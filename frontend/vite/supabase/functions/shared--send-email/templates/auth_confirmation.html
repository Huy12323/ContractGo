<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email - ContractGo</title>
    <style>
      body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #eef2ff; }
      .container { max-width: 480px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #e8e8e8; }
      .header { background: #6366f1; padding: 32px 24px; text-align: center; }
      .logo { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 20px; color: #fff; }
      .header h1 { color: #ffffff; font-size: 18px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
      .content { padding: 32px 28px; }
      .content h2 { color: #1a1a1a; font-size: 20px; font-weight: 600; margin: 0 0 12px; }
      .content p { color: #555; font-size: 15px; line-height: 1.6; margin: 0 0 16px; }
      .btn { display: inline-block; padding: 12px 28px; background: #6366f1; color: #fff !important; text-decoration: none !important; border-radius: 6px; font-weight: 600; font-size: 15px; }
      .btn-wrap { text-align: center; margin: 24px 0; }
      .divider { height: 1px; background: #e8e8e8; margin: 24px 0; }
      .muted { color: #999; font-size: 13px; line-height: 1.5; }
      .footer { background: #fafafa; padding: 20px 28px; text-align: center; border-top: 1px solid #e8e8e8; }
      .footer p { color: #999; font-size: 12px; margin: 4px 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">&#128221;</div>
        <h1>ContractGo</h1>
      </div>
      <div class="content">
        <h2>Verify your email</h2>
        <p>Hi {{name}}, thanks for signing up! Click the button below to verify your email address.</p>
        <div class="btn-wrap">
          <a href="{{confirmationUrl}}" class="btn" style="color: #fff !important; text-decoration: none !important;">Verify Email Address</a>
        </div>
        <div class="divider"></div>
        <p class="muted">This link expires in 24 hours. If you didn't create an account, you can safely ignore this email.</p>
      </div>
      <div class="footer">
        <p>&copy; 2026 ContractGo. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
