import_map = "./functions/api_templates_list/deno.json"
entrypoint = "./functions/api_templates_list/index.ts"

# CG-045/CG-046 (v1.4.0 Phase D). The webhook delivery pump — the same caller
# shape as the two envelope jobs above: `net.http_post` from inside Postgres,
# no JWT, `x-cron-secret` as the whole of the authorization.
#
# It runs EVERY MINUTE rather than hourly, because the retry ladder's first rung
# is 60 seconds and a coarser tick would make "retry in 1 minute" a lie. Like the
# other two it takes NO input: it selects its own work, so there is nothing a
# caller could use to widen its reach even holding the secret.
#
# `webhooks_test-send` is deliberately NOT listed — it wants a JWT.

[functions.webhooks_deliver-pending]
enabled = true
verify_jwt = false
import_map = "./functions/webhooks_deliver-pending/deno.json"
entrypoint = "./functions/webhooks_deliver-pending/index.ts"
