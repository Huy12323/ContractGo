name: CI

# Frontend quality gate. Blocks the MERGE, not the deploy — Cloudflare Pages
# auto-deploys on push and `build` is deliberately NOT gated on `check` so a lint
# rule can never take production down.
#
# `demo` is excluded on purpose: it is a personal working branch, and CI on every
# push there just trains people to ignore red.

on:
    push:
        branches: [master, dev]
        paths-ignore:
            - "cycles/**"
            - "docs/**"
            - "**/*.md"
    pull_request:
        branches: [master, dev]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Must come BEFORE setup-node: `cache: pnpm` needs pnpm on PATH.
            # Version must match `packageManager` in package.json exactly or
            # Corepack errors out.
            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # Steps are separate and sequential rather than `pnpm check` so the
            # job graph shows WHICH gate failed. `pnpm check` stays the local
            # ergonomic entry point.
            - name: Format check
              run: pnpm format:check

            - name: Type check
              run: pnpm type-check

            # `lint`, not `lint:strict` — exhaustive-deps is still "warn" while
            # the known warnings are worked down. Flip this when the ratchet closes.
            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test:fe

            - name: Build
              run: pnpm build

    # Separate job, not a step on `frontend`, for the same reason the steps above
    # are separate: the job graph should say WHICH gate failed. This one is also
    # the slowest (it boots Postgres and replays every migration), so keeping it
    # off the frontend job means a lint failure still reports in seconds.
    #
    # Two gates in one: `supabase start` replays all migrations — any migration
    # whose own VERIFY block raises fails here — and then CG-051's
    # `assert_rls_invariants()` checks the posture holds for tables added SINCE
    # that migration. Supabase's default privileges grant new tables to anon and
    # authenticated, so the safe state is not the default and drift is silent
    # without this.
    database:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: latest

            # Only what the assertion needs. Excluding the rest cuts the boot
            # substantially and none of it participates in schema replay.
            - name: Start Supabase
              working-directory: frontend/vite
              run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit

            - name: Assert RLS invariants
              working-directory: frontend/vite
              run: |
                  psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
                       --set ON_ERROR_STOP=1 \
                       -c "SELECT public.assert_rls_invariants();"

            - name: Stop Supabase
              if: always()
              working-directory: frontend/vite
              run: supabase stop --no-backup
